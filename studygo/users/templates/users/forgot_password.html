{# users/templates/users/forgot_password.html #}
{% extends "base.html" %}
{% block title %}忘記密碼 — StudyGo Taiwan{% endblock %}

{% block content %}
<section class="page" style="padding:28px 38px 48px;">
  <div style="max-width:480px;margin:0 auto;">
    <a href="{% url 'login_page' %}" class="back-link">← 返回登入</a>
    <div class="auth-card">
      <div class="auth-body">

        <div id="forgotStep1">
          <div class="auth-title">忘記密碼 🔑</div>
          <div class="auth-sub">輸入您的電子郵件，我們將寄送重設密碼連結。</div>
          <form id="forgotForm" onsubmit="handleForgot(event)">
            {% csrf_token %}
            <div class="field">
              <label>電子郵件</label>
              <input type="email" name="email" id="forgotEmail" placeholder="your@email.com" required />
              <div class="field-error hidden" id="forgotEmailErr"></div>
            </div>
            <button type="submit" class="btn-primary" id="forgotBtn">寄送重設連結</button>
          </form>
        </div>

        <div id="forgotStep2" class="hidden" style="text-align:center;padding:20px 0;">
          <div style="font-size:56px;margin-bottom:16px;">📧</div>
          <div class="auth-title">郵件已寄出！</div>
          <div class="auth-sub" style="margin-bottom:20px;">
            重設連結已寄至 <b id="forgotEmailSent"></b>，請至信箱點擊連結。
          </div>
          <a href="{% url 'login_page' %}" class="btn-outline-sm"
            style="padding:12px 28px;border-radius:10px;">返回登入頁面</a>
        </div>

      </div>
    </div>
  </div>
</section>
{% endblock %}
