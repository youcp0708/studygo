{# users/templates/users/reset_password.html #}
{% extends "base.html" %}
{% load i18n %}
{% block title %}{% trans "重設密碼" %} — StudyGo Taiwan{% endblock %}

{% block content %}
<section class="page" style="padding:28px 38px 48px;">
  <div style="max-width:480px;margin:0 auto;">
    <div class="auth-card">
      <div class="auth-body">
        <div class="auth-title">{% trans "重設密碼" %} 🔒</div>
        <div class="auth-sub">{% trans "請輸入您的新密碼。" %}</div>

        <form id="resetPwForm" onsubmit="handleResetPw(event)">
          {% csrf_token %}
          <input type="hidden" id="resetUid" value="{{ uid }}" />
          <input type="hidden" id="resetToken" value="{{ token }}" />

          <div class="field">
            <label>{% trans "新密碼" %}</label>
            <input type="password" id="resetPw1" placeholder="{% trans '至少 8 字元' %}" required
              oninput="checkPwStrength(this.value,'resetPwFill',null)" />
            <div class="pw-strength-bar">
              <div class="pw-strength-fill" id="resetPwFill"></div>
            </div>
          </div>

          <div class="field">
            <label>{% trans "確認新密碼" %}</label>
            <input type="password" id="resetPw2" placeholder="{% trans '再次輸入新密碼' %}" required />
            <div class="field-error hidden" id="resetPwErr"></div>
          </div>

          <button type="submit" class="btn-primary" id="resetPwBtn">
            {% trans "確認重設密碼" %}
          </button>
        </form>
      </div>
    </div>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
  async function handleResetPw(e) {
    e.preventDefault();

    const p1 = document.getElementById('resetPw1').value;
    const p2 = document.getElementById('resetPw2').value;
    const uid = document.getElementById('resetUid').value;
    const tok = document.getElementById('resetToken').value;

    if (p1 !== p2) {
      showError('resetPwErr', '{% trans "兩次密碼不一致" %}');
      return;
    }

    setLoading('resetPwBtn', true);

    const { ok, data } = await apiFetch('/api/users/password-reset/confirm/', 'POST', {
      uid,
      token: tok,
      new_password: p1
    });

    setLoading('resetPwBtn', false);

    if (ok) {
      showToast('{% trans "密碼重設成功，請重新登入" %}', 'success');
      setTimeout(() => {
        window.location.href = "{% url 'login_page' %}";
      }, 1500);
    } else {
      showError('resetPwErr', data?.message || '{% trans "重設失敗，連結可能已過期" %}');
    }
  }
</script>
{% endblock %}
