name: Keep Alive (Supabase DB)

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}   # 允許在 Actions 頁面手動觸發（測試用）

concurrency:
  group: keep-alive-db
  cancel-in-progress: true

jobs:
  ping-db:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run lightweight query
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::尚未設定 Repository secret「SUPABASE_DB_URL」，請到 Settings → Secrets and variables → Actions → Secrets 新增。"
            exit 1
          fi

          # 去除貼上時可能夾帶的前後空白/換行（例如 sslmode=require\n 會導致 psql 解析失敗）
          SUPABASE_DB_URL=$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\r\n' | xargs)

          # ubuntu-latest 內建 psql，不需額外安裝。
          # 只做一個唯讀的計數查詢，不讀取、不修改任何使用者資料內容。
          echo "Pinging Supabase database ..."
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "SELECT count(*) FROM users_customuser;"

          echo "OK — 資料庫已保持活躍。"
